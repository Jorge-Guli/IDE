name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # El nombre de este job es el check requerido por la protección de `main`: no lo cambies.
    name: Calidad y tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: ruff check
        run: ruff check

      - name: ruff format --check
        run: ruff format --check

      - name: pyright
        run: pyright

      - name: pytest con cobertura
        run: python -m pytest --cov=ide

      # El hash de `str` se aleatoriza por proceso: la suite debe pasar con semillas distintas.
      - name: pytest con otro PYTHONHASHSEED
        run: PYTHONHASHSEED=12345 python -m pytest -q

      - name: Validar specs de OpenSpec
        env:
          OPENSPEC_TELEMETRY: "0"
        run: npx -y @fission-ai/openspec@latest validate --all --strict

  compat:
    # Respalda el mínimo declarado en pyproject.toml (>=3.11): sólo la suite, sin calidad estática.
    name: Compatibilidad (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: pytest
        run: python -m pytest -q
